<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: page.excerpt | strip_html | strip_newlines | escape }}">
  <title>{{ page.title | escape }} | {{ site.title | escape }}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/site.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="home-link" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
      <nav aria-label="Blog navigation"><a href="{{ '/' | relative_url }}#blog">Back to blog</a></nav>
    </div>
  </header>
  <main id="main" class="blog-post">
    <article>
      <header class="post-header">
        <h1>{{ page.title | escape }}</h1>
        <time class="period" datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%B %d, %Y' }}</time>
      </header>
      <div class="post-content">{{ content }}</div>
    </article>
    <footer>
      <span>© {{ site.time | date: '%Y' }} {{ site.profile.name | escape }}</span>
      <a href="{{ '/' | relative_url }}#blog">Back to blog</a>
    </footer>
  </main>
</body>
</html>
