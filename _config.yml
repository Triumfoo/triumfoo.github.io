about: |
  Hello! I am HanZhong Seo, an M.S. student in Artificial Intelligence at Konkuk University.
  My research interests include AI-native networks, vision-language-action, and reinforcement learning.

  My thesis, *SURAG: Step-wise Search Utility Reward for Efficient Agentic RAG*, investigates
  reinforcement learning approaches to improve search efficiency and decision-making in agentic RAG.
  I designed a step-wise search utility reward and a structured reasoning process to enhance reasoning performance.

  I received my B.S. in Electronic Information Engineering from Dalian University of Technology.
  My project experience includes preprocessing battlefield simulation data and fine-tuning large language models
  for military situational reasoning.

